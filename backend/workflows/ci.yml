name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: clearn
          POSTGRES_USER: clearn
          POSTGRES_PASSWORD: clearn_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run migrations
        env:
          PGPASSWORD: clearn_secret
        run: |
          for f in migrations/auth/*.up.sql; do psql -h localhost -U clearn -d clearn -f "$f"; done
          for f in migrations/lms/*.up.sql; do psql -h localhost -U clearn -d clearn -f "$f"; done
          for f in migrations/gamification/*.up.sql; do psql -h localhost -U clearn -d clearn -f "$f"; done
      - name: Run tests
        run: go test ./... -v

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        service: [gateway, auth-service, lms-service, code-runner, gamification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ${{ matrix.service }}
        run: CGO_ENABLED=0 go build -o bin/${{ matrix.service }} ./cmd/${{ matrix.service }}
